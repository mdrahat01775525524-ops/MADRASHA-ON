
name: Build MADRASAH ONE APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Check uploaded ZIP
        run: ls -lh

      - name: Extract project
        run: unzip MADRASAH_ONE_Offline_Test_v1_1.zip -d project

      - name: Find Gradle project
        run: find project -name build.gradle -o -name build.gradle.kts

      - name: Build APK
        run: |
          cd project/MadrasahOne_Test
          gradle assembleDebug